name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: alembic upgrade head
      - run: python -m unittest discover -s tests -p 'test_production_config.py'
      - run: python -m unittest discover -s tests -p 'test_price_management.py'
      - run: python -m unittest discover -s tests -p 'test_admin_orders.py'
      - run: python -m unittest discover -s tests -p 'test_order_status.py'
      - run: python -m unittest discover -s tests -p 'test_payment_integration.py'
      - run: python -m unittest discover -s tests -p 'test_production_e2e_config.py'
      - run: python -m unittest discover -s tests -p 'test_mobile_ai_api.py'
      - run: python -m unittest discover -s tests -p 'test_sensitive_data_audit.py'
      - run: python -m unittest discover -s tests -p 'test_delivery_token_security.py'
      - run: python -m unittest discover -s tests -p 'test_whatsapp_webhook_security.py'
      - run: python -m unittest discover -s tests -p 'test_request_security.py'
      - run: python -m unittest discover -s tests -p 'test_payment_replay_hardening.py'
      - run: python -m unittest discover -s tests -p 'test_customer_idor_audit.py'
      - run: docker build -t talegaon-fresh-ai-backend:ci .
